apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aocr.fullname" . }}-auth
  labels:
    {{- include "aocr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aocr.name" . }}-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aocr.name" . }}-auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.auth.port }}"
    spec:
      containers:
      - name: auth
        image: "{{ .Values.image.repository }}/aocr-auth:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.auth.port }}
        env:
        - name: POSTGRES_HOST
          value: {{ default (printf "%s-postgres" (include "aocr.fullname" .)) .Values.postgres.host | quote }}
        - name: POSTGRES_PORT
          value: {{ .Values.postgres.port | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "aocr.fullname" . }}-secrets
              key: postgres-password
        - name: VALIDATION_SERVICE_URL
          value: {{ .Values.auth.validationServiceUrl | quote }}
        - name: AUTH_PAT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "aocr.fullname" . }}-secrets
              key: auth-pat-token
        - name: AUTH_PAT_TOKENS
          valueFrom:
            secretKeyRef:
              name: {{ include "aocr.fullname" . }}-secrets
              key: auth-pat-tokens
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "aocr.fullname" . }}-secrets
              key: jwt-private-key
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aocr.fullname" . }}-auth
  labels:
    {{- include "aocr.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "aocr.name" . }}-auth
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "{{ .Values.auth.port }}"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: {{ .Values.auth.port }}
  selector:
    app.kubernetes.io/name: {{ include "aocr.name" . }}-auth
