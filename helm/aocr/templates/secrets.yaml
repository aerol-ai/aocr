{{- $jwtPrivateKey := required "auth.jwtPrivateKey is required" .Values.auth.jwtPrivateKey -}}
{{- $jwtPublicCertificate := required "auth.jwtPublicCertificate is required and must contain a PEM certificate (BEGIN CERTIFICATE)" (default .Values.auth.jwtPublicKey .Values.auth.jwtPublicCertificate) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aocr.fullname" . }}-secrets
type: Opaque
data:
  postgres-password: {{ .Values.postgres.password | b64enc | quote }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  hook-token: {{ .Values.hooks.token | b64enc | quote }}
  auth-pat-token: {{ default "" .Values.auth.pat.token | b64enc | quote }}
  auth-pat-tokens: {{ join "\n" (default (list) .Values.auth.pat.tokens) | b64enc | quote }}
  auth-cluster-pat-tokens: {{ join "\n" (default (list) (default (list) .Values.auth.clusterPat.tokens)) | b64enc | quote }}
  {{- /* F19: comma-joined wrap key ring. Current key first, previous keys
       follow so unwrap() can fall back during rotation. Empty when the
       mirror's upstream-auth path is not in use; the auth service treats an
       empty ring as "wrapped-upstream strategy disabled". */ -}}
  {{- $wrapRing := list -}}
  {{- if .Values.auth.upstreamAuth.wrapKey -}}
    {{- $wrapRing = append $wrapRing .Values.auth.upstreamAuth.wrapKey -}}
  {{- end -}}
  {{- range (default (list) .Values.auth.upstreamAuth.wrapKeysPrevious) -}}
    {{- $wrapRing = append $wrapRing . -}}
  {{- end }}
  upstream-auth-wrap-keys: {{ join "," $wrapRing | b64enc | quote }}
  replreg-secret: {{ .Values.registry.replregSecret | b64enc | quote }}
  # Provide plain string values. This template base64-encodes them for the Kubernetes Secret.
  jwt-private-key: {{ $jwtPrivateKey | b64enc | quote }}
  jwt-public-cert: {{ $jwtPublicCertificate | b64enc | quote }}
  jwt-public-key: {{ $jwtPublicCertificate | b64enc | quote }}
  s3-access-key: {{ default "" .Values.registry.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ default "" .Values.registry.s3.secretKey | b64enc | quote }}
  internal-api-token: {{ default "" .Values.hooks.internalApiToken | b64enc | quote }}
  {{- if .Values.mirror.enabled }}
  mirror-writer-username: {{ .Values.mirror.writerUsername | b64enc | quote }}
  mirror-writer-password: {{ .Values.mirror.writerPassword | b64enc | quote }}
  {{- end }}
